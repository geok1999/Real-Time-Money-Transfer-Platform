apiVersion: 1

datasources:

  # LOKI (Logs)
  # Receives logs pushed by the Loki4j Logback appender in Spring Boot.
  # Grafana queries this to display and search log lines.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        # Extract traceId from log lines and link to Tempo.
        # Matches log pattern: traceId=4bf92f3577b34da6
        - datasourceUid: tempo
          name: TraceID
          matcherRegex: 'traceId=([a-f0-9]+)'
          url: '${__value.raw}'
          urlDisplayLabel: 'View Trace in Tempo'

  # TEMPO (Traces)
  # Receives spans from Spring Boot via OTLP HTTP on port 4318.
  # Grafana queries this to display distributed trace waterfalls.
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      spanBar:
        type: 'None'

  # PROMETHEUS (Metrics) - PHASE 2
  # Uncomment when the Prometheus container is running.
  #
  # - name: Prometheus
  #   type: prometheus
  #   uid: prometheus
  #   access: proxy
  #   url: http://prometheus:9090
  #   isDefault: false
  #   jsonData:
  #     httpMethod: POST
  #     exemplarTraceIdDestinations:
  #       - name: traceID
  #         datasourceUid: tempo